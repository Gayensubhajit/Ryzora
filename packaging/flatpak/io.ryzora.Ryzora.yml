# Ryzora Flatpak Manifest (io.ryzora.Ryzora)
#
# Security Contract:
# - Core Ryzora capabilities (rices, themes, dotfiles, lockscreen previews) run
#   fully unprivileged in user space.
# - Privileged SDDM integration requires the native ryzora-sddm-helper + Polkit
#   policy installed on the host. The sandbox does NOT grant --filesystem=host,
#   arbitrary host execution, or system bus Polkit escalation.
#   Privileged SDDM targets are runtime capability-detected as host-native only.
#
# Runtime note: GNOME 50 / Freedesktop SDK 24.08 (current stable as of 2026).
# Node.js 20 is vendored as a build-only module (no official node20 Sdk extension exists).
# Rust is provided by org.freedesktop.Sdk.Extension.rust-stable//24.08.
# cargo-sources.json and npm-sources.json MUST be committed alongside this manifest.
app-id: io.ryzora.Ryzora
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: ryzora

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --share=network
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=xdg-config/hypr:create
  - --filesystem=xdg-config/waybar:create
  - --filesystem=xdg-config/ryzora:create
  - --filesystem=xdg-data/ryzora:create
  - --filesystem=xdg-data/icons:ro
  - --filesystem=xdg-data/themes:ro

build-options:
  # rust-stable extension matches Freedesktop SDK 24.08 (GNOME 50 base)
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/ryzora/cargo

modules:
  # Bundle Node.js 20 as a build-time module (no official Sdk.Extension.node20 exists)
  - name: nodejs
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/node /app/bin/node
      - install -Dm755 bin/npm /app/bin/npm
      - install -Dm755 bin/npx /app/bin/npx
      - cp -r lib /app/
    sources:
      - type: archive
        url: https://nodejs.org/dist/v20.19.0/node-v20.19.0-linux-x64.tar.xz
        sha256: e29f34dcb4b92e39de83c76dfe3c7c6a3f1a6e9d2b09e504f2219e0c19de17db
        strip-components: 1

  - name: ryzora
    buildsystem: simple
    build-options:
      env:
        PATH: /app/bin:/usr/lib/sdk/rust-stable/bin:/usr/bin:/bin
        CARGO_HOME: /run/build/ryzora/cargo
        npm_config_offline: 'true'
    build-commands:
      # npm install from committed npm-sources.json (offline, no network)
      - npm install --offline
      - npm run build
      # cargo build from committed cargo-sources.json (offline, no network)
      - cargo build --manifest-path src-tauri/Cargo.toml --release --locked
      # Install binary and desktop integration
      - install -Dm755 src-tauri/target/release/ryzora /app/bin/ryzora
      - install -Dm644 dist-assets/io.ryzora.Ryzora.desktop /app/share/applications/io.ryzora.Ryzora.desktop
      - install -Dm644 dist-assets/io.ryzora.Ryzora.metainfo.xml /app/share/metainfo/io.ryzora.Ryzora.metainfo.xml
      - install -Dm644 dist-assets/icons/hicolor/scalable/apps/ryzora.svg /app/share/icons/hicolor/scalable/apps/ryzora.svg
      - |
        for size in 16 32 48 64 128 256 512; do
          if [ -f dist-assets/icons/hicolor/${size}x${size}/apps/ryzora.png ]; then
            install -Dm644 dist-assets/icons/hicolor/${size}x${size}/apps/ryzora.png \
              /app/share/icons/hicolor/${size}x${size}/apps/ryzora.png
          fi
        done
    sources:
      - type: dir
        path: ../../
      # cargo-sources.json: generated by flatpak-cargo-generator from Cargo.lock
      # Run: python3 flatpak-cargo-generator.py src-tauri/Cargo.lock -o packaging/flatpak/cargo-sources.json
      - cargo-sources.json
      # npm-sources.json: generated by flatpak-node-generator from package-lock.json
      # Run: flatpak-node-generator npm package-lock.json -o packaging/flatpak/npm-sources.json
      - npm-sources.json
