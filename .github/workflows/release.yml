name: Release Ryzora

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build, Package, Sign & Publish Linux Release
    runs-on: ubuntu-24.04
    steps:
      - name: Clean Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            appstream \
            dpkg-dev \
            file \
            patchelf

      - name: Verify Version Consistency
        run: |
          CARGO_VER=$(grep '^version' src-tauri/Cargo.toml | head -n1 | cut -d '"' -f 2)
          NPM_VER=$(node -p "require('./package.json').version")
          TAURI_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")

          echo "Cargo.toml: $CARGO_VER"
          echo "package.json: $NPM_VER"
          echo "tauri.conf.json: $TAURI_VER"

          if [ "$CARGO_VER" != "$NPM_VER" ] || [ "$NPM_VER" != "$TAURI_VER" ]; then
            echo "Version mismatch detected across manifests!"
            exit 1
          fi
          echo "All version strings match: $CARGO_VER"

      - name: Build Frontend & Release Binaries
        run: |
          npm ci || npm install
          npm run build
          cargo build --manifest-path src-tauri/Cargo.toml --release --locked

      - name: Assemble Release Artifacts
        id: package
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "${{ github.ref_name }}" ]; then
            VERSION="${{ github.event.inputs.version || '0.1.0' }}"
          fi

          mkdir -p release-artifacts

          # Tarball packaging
          DIST_DIR="ryzora-v${VERSION}-linux-x86_64"
          mkdir -p "$DIST_DIR/icons"
          cp src-tauri/target/release/ryzora "$DIST_DIR/"
          cp src-tauri/target/release/ryzora-ci "$DIST_DIR/"
          cp dist-assets/io.ryzora.Ryzora.desktop "$DIST_DIR/"
          cp dist-assets/io.ryzora.Ryzora.metainfo.xml "$DIST_DIR/"
          cp -r dist-assets/icons/hicolor "$DIST_DIR/icons/"
          cp LICENSE README.md "$DIST_DIR/"
          tar -czvf "release-artifacts/${DIST_DIR}.tar.gz" "$DIST_DIR"

          # AppImage packaging
          curl -sL https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          export APPIMAGETOOL="$PWD/squashfs-root/AppRun"
          ./scripts/build-appimage.sh
          cp target/appimage/Ryzora-*.AppImage release-artifacts/

          # Debian packaging
          ./scripts/build-deb.sh
          cp target/deb/*.deb release-artifacts/ 2>/dev/null || true

          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate Checksums & Sign Artifacts
        env:
          RYZORA_RELEASE_SIGNING_KEY: ${{ secrets.RYZORA_RELEASE_SIGNING_KEY }}
          RYZORA_RELEASE_PUBKEY: ${{ secrets.RYZORA_RELEASE_PUBKEY }}
        run: |
          cd release-artifacts

          # Generate canonical SHA256SUMS
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

          # If release signing key is provided in secrets, perform Ed25519 signature
          if [ -n "$RYZORA_RELEASE_SIGNING_KEY" ]; then
            echo "$RYZORA_RELEASE_SIGNING_KEY" > release.key
            chmod 600 release.key

            ../src-tauri/target/release/ryzora-ci sign-file SHA256SUMS.txt release.key --out SHA256SUMS.txt.sig
            rm -f release.key

            # Fail-closed signature verification
            ../src-tauri/target/release/ryzora-ci verify-file SHA256SUMS.txt SHA256SUMS.txt.sig "$RYZORA_RELEASE_PUBKEY"
            echo "Release signature verified successfully!"
          else
            echo "Notice: No RYZORA_RELEASE_SIGNING_KEY secret configured. Release signing skipped in non-production run."
          fi

      - name: Publish Verified GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
