name: Release Ryzora

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package Linux Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            file \
            patchelf

      - name: Install Frontend Dependencies & Build UI
        run: |
          npm ci || npm install
          npm run build

      - name: Build Standalone Release Binaries
        env:
          # In official release CI, the operator can provide RYZORA_OFFICIAL_ROOT_KEY secret
          RYZORA_OFFICIAL_ROOT_KEY: ${{ secrets.RYZORA_OFFICIAL_ROOT_KEY || '' }}
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --release --locked

      - name: Assemble Release Tarball
        id: package-tarball
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "${{ github.ref_name }}" ]; then
            VERSION="${{ github.event.inputs.version || '0.1.0' }}"
          fi

          DIST_DIR="ryzora-v${VERSION}-linux-x86_64"
          mkdir -p "$DIST_DIR/icons"
          cp src-tauri/target/release/ryzora "$DIST_DIR/"
          cp src-tauri/target/release/ryzora-ci "$DIST_DIR/"
          cp dist-assets/ryzora.desktop "$DIST_DIR/"
          cp -r dist-assets/icons/hicolor "$DIST_DIR/icons/"
          cp LICENSE README.md "$DIST_DIR/"

          tar -czvf "${DIST_DIR}.tar.gz" "$DIST_DIR"
          echo "tarball=${DIST_DIR}.tar.gz" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build AppImage Bundle
        run: |
          # Download appimagetool
          curl -sL https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          export APPIMAGETOOL="$PWD/squashfs-root/AppRun"

          ./scripts/build-appimage.sh
          mv target/appimage/Ryzora-x86_64.AppImage "Ryzora-${{ steps.package-tarball.outputs.version }}-x86_64.AppImage" || true

      - name: Generate Checksums & Metadata
        run: |
          mkdir -p release-artifacts
          cp ryzora-v*.tar.gz release-artifacts/ 2>/dev/null || true
          cp Ryzora-*.AppImage release-artifacts/ 2>/dev/null || true

          cd release-artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
