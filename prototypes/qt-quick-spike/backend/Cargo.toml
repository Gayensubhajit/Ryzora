[package]
name = "ryzora-spike-backend"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
ryzora-core = { path = "../../../crates/ryzora-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"
